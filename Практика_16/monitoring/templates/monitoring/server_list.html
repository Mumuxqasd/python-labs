{% extends "monitoring/base.html" %}{% block content %}<h1>Серверы</h1><form><input name="search" placeholder="Поиск"><select name="status"><option value="">Все</option><option>online</option><option>offline</option><option>maintenance</option></select><button>Найти</button></form><a href="/servers/create/">Создать</a><table border="1"><tr><th>Hostname</th><th>IP</th><th>OS</th><th>Status</th></tr>{% for s in page %}<tr><td><a href="/servers/{{ s.id }}/">{{ s.hostname }}</a></td><td>{{ s.ip }}</td><td>{{ s.os_name }}</td><td>{{ s.status }}</td></tr>{% endfor %}</table><div>{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}">Назад</a>{% endif %} {{ page.number }} {% if page.has_next %}<a href="?page={{ page.next_page_number }}">Вперёд</a>{% endif %}</div>{% endblock %}
